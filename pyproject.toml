[project]
name = "saul-laboratorio3-kedro"
version = "0.1.0"
description = ""
authors = [
    {name = "Saul Alvaro",email = "saulenriquealvarocurinaupa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kedro (>=1.6.0,<2.0.0)",
    "kedro-datasets[json] (>=9.6.0,<10.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.kedro]
package_name = "laboratorio3_kedro"
project_name = "saul_laboratorio3_kedro"
kedro_init_version = "1.6.0"
tools = "['Testing', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "8431fc50dd7d484690d52808d0948691"
